<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniSearch</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
         background: #fff; color: #202124; }
  .center { min-height: 92vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; }
  .logo { font-size: 64px; font-weight: 700; letter-spacing: -2px; margin-bottom: 28px;
          font-family: Arial, system-ui, sans-serif; }
  .logo .a { color: #4285F4; } .logo .b { color: #EA4335; }
  .logo .c { color: #FBBC05; } .logo .d { color: #4285F4; }
  .logo .e { color: #34A853; } .logo .f { color: #EA4335; }
  form { width: 100%; max-width: 560px; }
  .box { display: flex; align-items: center; border: 1px solid #dfe1e5;
         border-radius: 24px; padding: 12px 18px; box-shadow: none; }
  .box:hover, .box:focus-within { box-shadow: 0 1px 6px rgba(32,33,36,.28);
         border-color: transparent; }
  input[type=text] { flex: 1; border: none; outline: none; font-size: 17px; }
  button { background: none; border: none; cursor: pointer; font-size: 17px; }
  .meta { margin-top: 30px; color: #70757a; font-size: 13px; }
  .foot { position: fixed; bottom: 0; width: 100%; background: #f2f2f2;
          padding: 12px 24px; color: #70757a; font-size: 13px; }
</style>
</head>
<body>
<div class="center">
  <div class="logo"><span class="a">M</span><span class="b">i</span><span class="c">n</span><span class="d">i</span><span class="e">S</span><span class="f">earch</span></div>
  <form action="/search" method="get">
    <div class="box">
      <input type="text" name="q" placeholder="Search MiniSearch…" autofocus>
      <button type="submit" title="Search">🔍</button>
    </div>
  </form>
  <div class="meta">{{ n_docs }} pages indexed · {{ n_terms }} terms · BM25 ranking</div>
</div>
<div class="foot">MiniSearch — a tiny but real search engine (educational project)</div>
</body>
</html>
