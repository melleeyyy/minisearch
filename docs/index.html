<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniSearch — a tiny but real search engine</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
         background: #fff; color: #202124; min-height: 100vh;
         display: flex; flex-direction: column; }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 20px; }
  .logo { font-size: 56px; font-weight: 700; letter-spacing: -2px; margin-bottom: 24px;
          font-family: Arial, system-ui, sans-serif; }
  .logo .a { color: #4285F4; } .logo .b { color: #EA4335; }
  .logo .c { color: #FBBC05; } .logo .d { color: #4285F4; }
  .logo .e { color: #34A853; } .logo .f { color: #EA4335; }
  form { width: 100%; max-width: 560px; }
  .box { display: flex; align-items: center; border: 1px solid #dfe1e5;
         border-radius: 24px; padding: 12px 18px; }
  .box:hover, .box:focus-within { box-shadow: 0 1px 6px rgba(32,33,36,.28);
         border-color: transparent; }
  input[type=text] { flex: 1; border: none; outline: none; font-size: 17px;
         background: transparent; }
  button { background: none; border: none; cursor: pointer; font-size: 17px; }
  .meta { margin-top: 26px; color: #70757a; font-size: 13px; text-align: center; }
  .status { margin-top: 10px; font-size: 13px; color: #5f6368; }
  .foot { background: #f2f2f2; padding: 12px 24px; color: #70757a; font-size: 13px; }
  .foot a { color: #4285F4; text-decoration: none; }
  .foot a:hover { text-decoration: underline; }

  /* ---- results mode ---- */
  body.results .center { flex: none; padding: 24px 0 12px; }
  body.results .logo { font-size: 30px; margin-bottom: 0; }
  body.results form { max-width: 580px; margin: 14px auto 0; }
  .tabs { display: flex; gap: 4px; max-width: 640px; margin: 14px auto 0;
          padding: 0 30px; }
  .tab { border: none; background: none; padding: 8px 14px; font-size: 14px;
         color: #5f6368; cursor: pointer; border-bottom: 3px solid transparent; }
  .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 500; }
  .stat { color: #70757a; font-size: 13px; padding: 6px 30px; max-width: 640px;
          margin: 0 auto; }
  .results-list { max-width: 640px; padding: 8px 30px 40px; margin: 0 auto; width: 100%; }
  .result { margin-bottom: 26px; }
  .src { color: #5f6368; font-size: 12px; margin-bottom: 2px; display: flex;
         align-items: center; gap: 6px; max-width: 100%; overflow: hidden;
         text-overflow: ellipsis; white-space: nowrap; }
  .badge { background: #f1f3f4; border-radius: 4px; padding: 1px 6px;
           font-size: 11px; color: #5f6368; }
  h3 a { color: #1a0dab; font-size: 19px; text-decoration: none; font-weight: 400; }
  h3 a:hover { text-decoration: underline; }
  p { color: #4d5156; font-size: 14px; line-height: 1.58; margin-top: 4px; }
  p b { font-weight: 700; color: #202124; }
  .score { color: #70757a; font-size: 11px; }
  .empty { padding: 40px 30px; color: #70757a; max-width: 640px; margin: 0 auto; }
</style>
</head>
<body>
<div class="center">
  <div class="logo"><span class="a">M</span><span class="b">i</span><span class="c">n</span><span class="d">i</span><span class="e">S</span><span class="f">search</span></div>
  <form id="sf" action="#" method="get" autocomplete="off">
    <div class="box">
      <input type="text" id="q" name="q" placeholder="Search the web…" autofocus>
      <button type="submit" title="Search">🔍</button>
    </div>
  </form>
  <div class="status" id="status"></div>
  <div class="meta" id="meta"></div>
</div>
<div id="tabsbar" class="tabs" hidden>
  <button class="tab active" id="tab-web" onclick="switchTab('web')">Web</button>
  <button class="tab" id="tab-index" onclick="switchTab('index')">My index</button>
</div>
<div id="stat" class="stat" hidden></div>
<div id="results" class="results-list" hidden></div>
<div class="foot">MiniSearch — a tiny but real search engine (educational project) ·
  <a href="https://github.com/melleeyyy/minisearch">GitHub</a> ·
  Web: live MediaWiki search across 4 languages · Index: BM25 ranking in your browser</div>

<script>
// ================= MiniSearch =================
// Two modes:
//   "web"   — live full-corpus search across several Wikipedia language
//             editions (~65M articles) via the MediaWiki API (no key needed)
//   "index" — BM25 over our own crawled pages, running fully in the browser

let TAB = "web";
let CURRENT_Q = "";
let INDEX_DATA = null;

// ---------- shared helpers ----------
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function setStat(text) {
  document.getElementById("stat").hidden = false;
  document.getElementById("stat").textContent = text;
}

// ---------- BM25 (our own index) ----------
const STOPWORDS = new Set(["ഒരു","ഈ","ആ","അത്","ഇത്","അവർ","ന്റെ","യും","ആണ്","ഉണ്ട്",
  "ചെയ്ത","വേണം","കൊണ്ട്","എന്ന","മറ്റ്","വളരെ","പിന്നീട്","ഇവിടെ",
  "the","a","an","of","and","in","to","is","are","was","for","on","with","as","by",
  "that","it","from","or","at","be","this"]);

// \p{M} (combining marks) keeps Malayalam vowel signs inside words
const TOKEN_RE = /[\p{L}\p{N}\p{M}]+/gu;

function tokenize(text) {
  const out = [];
  for (const t of text.toLowerCase().match(TOKEN_RE) || []) {
    if (t.length > 1 && !STOPWORDS.has(t)) out.push(t);
  }
  return out;
}

const K1 = 1.5, B = 0.75;

async function loadIndex() {
  if (INDEX_DATA) return INDEX_DATA;
  try {
    const res = await fetch("data/search-data.json");
    INDEX_DATA = await res.json();
  } catch (e) {
    INDEX_DATA = null;
  }
  return INDEX_DATA;
}

function bm25Search(query, topK = 10) {
  const qtoks = tokenize(query);
  if (!qtoks.length || !INDEX_DATA) return [];
  const { N, avgdl, docs, postings } = INDEX_DATA;
  const dl = avgdl || 1;
  const scores = {};
  for (const term of qtoks) {
    const plist = postings[term];
    if (!plist) continue;
    const idf = Math.log(1 + (N - Object.keys(plist).length + 0.5) /
                         (Object.keys(plist).length + 0.5));
    for (const [url, tf] of Object.entries(plist)) {
      const denom = tf + K1 * (1 - B + B * (docs[url].length / dl));
      scores[url] = (scores[url] || 0) + idf * (tf * (K1 + 1) / denom);
    }
  }
  return Object.entries(scores).sort((a, b) => b[1] - a[1]).slice(0, topK);
}

function snippet(text, qtoks, width = 260) {
  const lower = text.toLowerCase();
  let pos = -1;
  for (const t of qtoks) { pos = lower.indexOf(t); if (pos >= 0) break; }
  if (pos < 0) return esc(text.slice(0, width));
  let start = Math.max(0, pos - Math.floor(width / 3));
  let snip = text.slice(start, start + width);
  if (start > 0) snip = "…" + snip;
  if (start + width < text.length) snip += "…";
  const pat = new RegExp("(" + qtoks.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
                                 .join("|") + ")", "gi");
  return esc(snip).replace(pat, "<b>$1</b>");
}

// ---------- live web search (MediaWiki API) ----------
const WIKIS = [
  { lang: "en", label: "en" },
  { lang: "ml", label: "ml" },
  { lang: "hi", label: "hi" },
  { lang: "ta", label: "ta" },
];

async function wikiSearch(lang, q, limit) {
  const url = "https://" + lang + ".wikipedia.org/w/api.php?action=query&list=search" +
    "&srsearch=" + encodeURIComponent(q) + "&srlimit=" + limit +
    "&format=json&origin=*";
  const res = await fetch(url);
  const data = await res.json();
  return (data.query && data.query.search ? data.query.search : []).map(r => ({
    title: r.title,
    // MediaWiki returns a snippet with <span class="searchmatch"> around hits
    snippet: (r.snippet || "").replace(/<span class="searchmatch">/g, "<b>")
                               .replace(/<\/span>/g, "</b>"),
    url: "https://" + lang + ".wikipedia.org/wiki/" +
         encodeURIComponent(r.title.replace(/ /g, "_")),
    lang: lang,
    words: r.wordcount,
  }));
}

async function webSearch(q) {
  const perWiki = 4;
  const lists = await Promise.allSettled(
    WIKIS.map(w => wikiSearch(w.lang, q, perWiki)));
  // interleave results round-robin so every language gets seen
  const out = [];
  for (let i = 0; i < perWiki; i++) {
    for (const r of lists) {
      if (r.status === "fulfilled" && r.value[i]) out.push(r.value[i]);
    }
  }
  return out;
}

// ---------- rendering ----------
function renderWeb(results) {
  const box = document.getElementById("results");
  box.innerHTML = "";
  for (const r of results) {
    const div = document.createElement("div");
    div.className = "result";
    div.innerHTML =
      '<div class="src"><span class="badge">' + r.lang + "</span> " +
      esc(r.url) + "</div>" +
      '<h3><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
      esc(r.title) + "</a></h3>" +
      "<p>" + r.snippet + "…</p>";
    box.appendChild(div);
  }
}

function renderIndex(results, qtoks) {
  const box = document.getElementById("results");
  box.innerHTML = "";
  for (const [url, score] of results) {
    const pg = INDEX_DATA.pages[url] || { title: url, text: "" };
    const div = document.createElement("div");
    div.className = "result";
    div.innerHTML =
      '<div class="src"><span class="badge">index</span> ' + esc(url) + "</div>" +
      '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener">' +
      esc(pg.title) + "</a></h3>" +
      "<p>" + snippet(pg.text, qtoks) + "</p>" +
      '<span class="score">BM25 score: ' + score.toFixed(2) + "</span>";
    box.appendChild(div);
  }
}

async function runSearch(q, tab) {
  CURRENT_Q = q;
  document.body.classList.add("results");
  document.getElementById("tabsbar").hidden = false;
  const box = document.getElementById("results");
  box.hidden = false;
  setStat("Searching…");

  if (tab === "web") {
    const results = await webSearch(q);
    if (q !== CURRENT_Q) return;  // a newer query started
    renderWeb(results);
    setStat(results.length + " web results for “" + q + "”");
  } else {
    await loadIndex();
    const results = INDEX_DATA ? bm25Search(q) : [];
    renderIndex(results, tokenize(q));
    setStat(INDEX_DATA
      ? INDEX_DATA.N + " indexed pages — " + results.length + " results for “" + q + "”"
      : "Index unavailable (run crawler + indexer + build_static first)");
  }
}

function switchTab(tab) {
  TAB = tab;
  document.getElementById("tab-web").classList.toggle("active", tab === "web");
  document.getElementById("tab-index").classList.toggle("active", tab === "index");
  if (CURRENT_Q) runSearch(CURRENT_Q, TAB);
  if (history.replaceState)
    history.replaceState(null, "", "?q=" + encodeURIComponent(CURRENT_Q) +
                             "&t=" + tab);
}

function go(q) {
  if (!q) return;
  document.getElementById("q").value = q;
  if (history.replaceState)
    history.replaceState(null, "", "?q=" + encodeURIComponent(q) + "&t=" + TAB);
  runSearch(q, TAB);
}

document.getElementById("sf").addEventListener("submit", (e) => {
  e.preventDefault();
  go(document.getElementById("q").value.trim());
});

// ---------- startup ----------
(async () => {
  // preload our index in the background; the web tab does not need it
  const idx = loadIndex();
  const meta = document.getElementById("meta");
  const data = await idx.catch(() => null);
  if (data) {
    meta.textContent = data.N + " pages crawled and indexed · " +
      Object.keys(data.postings).length + " terms · BM25 ranking";
  } else {
    meta.textContent = "Live web search powered by the MediaWiki API";
  }
  const params = new URLSearchParams(location.search);
  const q = params.get("q");
  const t = params.get("t");
  if (t === "index") {
    TAB = "index";
    document.getElementById("tab-web").classList.remove("active");
    document.getElementById("tab-index").classList.add("active");
  }
  if (q) go(q);
})();
</script>
</body>
</html>
